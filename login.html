<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Penghuni - Safety Fire IoT</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
    h2 { text-align: center; margin-bottom: 20px; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
    p { text-align: center; font-size: 14px; margin-top: 15px; }
    a { color: #28a745; text-decoration: none; }
  </style>

  <!-- Firebase SDK versi 8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="card">
  <h2>Login Penghuni</h2>
  <form id="loginForm">
    <div class="form-group">
      <label>Pilih Ruangan / Sensor:</label>
      <div class="form-group">
  <label>Nomor Kamar:</label>
  <select id="ruanganKey" required>
    <option value="ruangan_1">Kamar 1</option>
    <option value="ruangan_2">Kamar 2</option>
    <option value="ruangan_3">Kamar 3</option>
    <option value="ruangan_4">Kamar 4</option>
  </select>
</div>
    </div>
    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="password" placeholder="Masukkan password" required>
    </div>
    <button type="submit">Masuk Dashboard</button>
  </form>
  <p>Belum punya akun? <a href="register.html">Daftar di sini</a></p>
</div>

<script>
  // Konfigurasi Firebase
  const firebaseConfig = {
    databaseURL: "https://sefty-fire-iot-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const key = document.getElementById('ruanganKey').value;
    const inputPassword = document.getElementById('password').value;

    // Ambil data user dari Firebase
    // Ambil data user dari Firebase
database.ref('users/' + key).once('value').then((snapshot) => {
  const data = snapshot.val();
  if (data && data.password === inputPassword) {
    
    // Filter agar teks nomor kamar menjadi ringkas (misal: "Kamar 1")
    let bersihKamar = data.nomor_kamar;
    if (bersihKamar.includes("1")) bersihKamar = "Kamar 1";
    else if (bersihKamar.includes("2")) bersihKamar = "Kamar 2";
    else if (bersihKamar.includes("3")) bersihKamar = "Kamar 3";
    else if (bersihKamar.includes("4")) bersihKamar = "Kamar 4";

    // Simpan sesi user ke LocalStorage
    localStorage.setItem('userLoggedIn', JSON.stringify({
      key: key,
      nama: data.nama,
      nomor_kamar: bersihKamar // Menggunakan data yang sudah dibersihkan
    }));
    
    alert("Selamat datang, " + data.nama + "!");
    window.location.href = "index.html"; 
  } else {
    alert("Password salah atau akun belum terdaftar!");
  }
});
    });

  
</script>

</body>
</html>
